services:
  spark-master:
    image: ${SPARK_IMAGE}
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      # - PYSPARK_PYTHON=python3
      # - PYSPARK_DRIVER_PYTHON=python3
      - PYSPARK_PYTHON=/opt/conda/envs/py311/bin/python
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "7077:7077"
      - "8087:8080"
    volumes:
      #- ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_data:/spark-events
      - ./app:/opt/spark/app
      #- ./jar_files:/opt/spark/jars
      #- ./my_data:/container_data
    networks:
      - networkDebeziumCDC

  spark-worker-1:
    image: ${SPARK_IMAGE}
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      # - PYSPARK_PYTHON=python3
      # - PYSPARK_DRIVER_PYTHON=python3
      - PYSPARK_PYTHON=/opt/conda/envs/py311/bin/python
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8082:8081"
    volumes:
      #- ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_data:/spark-events
      - ./app:/opt/spark/app
      #- ./jar_files:/opt/spark/jars
      #- ./my_data:/container_data
    networks:
      - networkDebeziumCDC

  spark-worker-2:
    image: ${SPARK_IMAGE}
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      # - PYSPARK_PYTHON=python3
      # - PYSPARK_DRIVER_PYTHON=python3
      - PYSPARK_PYTHON=/opt/conda/envs/py311/bin/python
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8083:8081"
    volumes:
      #- ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_data:/spark-events
      - ./app:/opt/spark/app
      #- ./jar_files:/opt/spark/jars
      #- ./my_data:/container_data
    networks:
      - networkDebeziumCDC

  spark-history:
    image: ${SPARK_IMAGE}
    container_name: spark-history
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/spark-events
      # - PYSPARK_PYTHON=python3
      # - PYSPARK_DRIVER_PYTHON=python3
      - PYSPARK_PYTHON=/opt/conda/envs/py311/bin/python
    user: "0:0"
    command: >
      bash -lc "mkdir -p /spark-events &&
                chmod -R 777 /spark-events &&
                /opt/spark/sbin/start-history-server.sh"
    ports:
      - "18080:18080"
    volumes:
      #- ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_data:/spark-events
      - ./app:/opt/spark/app
    networks:
      - networkDebeziumCDC

volumes:
  spark_data:
    name: DebeziumCDC_project3_sparkData

networks:
  networkDebeziumCDC:
    name: networkDebeziumCDC_project3
    external: true